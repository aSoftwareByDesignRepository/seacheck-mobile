appId: de.softwarebydesign.seacheck
tags:
  - helper
---
# Open Downloads — Atlas phones expose tab.downloads directly; compact may use More sheet.
# Stay on this screen briefly so the hidden offline map engine can mount (Map tab unfocused).
- runFlow:
    when:
      visible:
        id: "tab.downloads"
    commands:
      - tapOn:
          id: "tab.downloads"
- runFlow:
    when:
      notVisible:
        id: "tab.downloads"
    commands:
      - tapOn:
          id: "tab.more"
      - extendedWaitUntil:
          visible:
            id: "tab.more.sheet"
          timeout: 15000
      - tapOn:
          id: "tab.downloads"
- extendedWaitUntil:
    visible:
      id: "screen.downloads"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 30000
