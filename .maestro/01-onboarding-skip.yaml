appId: de.softwarebydesign.seacheck
tags:
  - helper
---
# Reach map chrome from cold start (onboarding) or warm start (already past it).
# Never require screen.onboarding — kill-mid / chained runs may already be on tabs.
- extendedWaitUntil:
    visible:
      id: "screen\\.onboarding|tab\\.map"
    timeout: 180000
- tapOn:
    id: "onboarding.disclaimer.continue"
    optional: true
- tapOn:
    id: "onboarding.location.skip"
    optional: true
- tapOn:
    id: "onboarding.battery.ack"
    optional: true
- tapOn:
    id: "onboarding.finish"
    optional: true
# System permission sheets may still appear despite pm grant.
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow only while using the app"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab.map"
    timeout: 120000
