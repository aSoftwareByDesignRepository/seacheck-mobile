appId: de.softwarebydesign.seacheck
tags:
  - helper
---
# Warm MapLibre on the Map tab before starting a pack download (emulator chart-engine).
- tapOn:
    id: "tab.map"
- extendedWaitUntil:
    visible:
      id: "screen.map"
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: "map.chartRetry"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
