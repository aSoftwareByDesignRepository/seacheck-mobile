# Download honesty E2E on a single Android emulator (cancel-mid + kill-mid).
# Not mocked: Kiel Bay download needs outbound HTTPS (OpenSeaMap). Retries once.
name: E2E Maestro

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/store/offlinePackStore.ts'
      - 'src/lib/offline/**'
      - 'src/features/downloads/**'
      - '.maestro/**'
      - 'scripts/maestro-e2e.sh'
      - 'scripts/ci-maestro.sh'
      - '.github/workflows/e2e-maestro.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    # Weekly safety net when download paths are quiet.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install npm deps
        run: npm ci

      - name: Install Maestro
        run: |
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Expo prebuild
        env:
          CI: 'true'
        run: |
          npx expo prebuild --platform android --non-interactive
          bash scripts/ensure-android-local-properties.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble debug APK
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Run Maestro on emulator (API 33)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect
          script: |
            export SEACHECK_MAESTRO_DEVICE="$(adb devices | awk '/\temulator-/{print $1; exit}')"
            export SEACHECK_DEBUG_APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            export SEACHECK_MAESTRO_ATTEMPTS=2
            npm run ci:maestro
