# Download honesty E2E on a single Android emulator (cancel-mid + kill-mid).
# Not mocked: Kiel Bay download needs outbound HTTPS (OpenSeaMap). Retries once.
#
# GHA pitfall (2026-08-30): Emulator 37 on ubuntu-latest links libpulse.so.0.
# Without libpulse0 the qemu binary exits immediately → "Timeout waiting for
# emulator to boot" / adb device not found. Keep -noaudio anyway.
name: E2E Maestro

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/store/offlinePackStore.ts'
      - 'src/lib/offline/**'
      - 'src/features/downloads/**'
      - '.maestro/**'
      - 'scripts/maestro-e2e.sh'
      - 'scripts/ci-maestro.sh'
      - '.github/workflows/e2e-maestro.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    # Weekly safety net when download paths are quiet.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Stable AVD paths on ubuntu-24.04 runners (android-emulator-runner #400).
      ANDROID_USER_HOME: /home/runner/.android
      ANDROID_EMULATOR_HOME: /home/runner/.android
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true
          docker-images: false
          large-packages: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM + emulator host libs
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm
          # Emulator 37 qemu-system-x86_64 DL_OPEN's libpulse even with -noaudio.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3
          # Prove the shared object exists before we waste 10m waiting on boot.
          test -e /usr/lib/x86_64-linux-gnu/libpulse.so.0 || test -e /lib/x86_64-linux-gnu/libpulse.so.0

      - name: Install npm deps
        run: npm ci

      - name: Install Maestro
        run: |
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Expo prebuild
        env:
          CI: 'true'
        run: |
          npx expo prebuild --platform android --non-interactive
          bash scripts/ensure-android-local-properties.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble debug APK
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Run Maestro on emulator (API 33)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Job-level env survives the runner's per-line `sh -c` (do not rely on export).
          SEACHECK_DEBUG_APK: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
          SEACHECK_MAESTRO_ATTEMPTS: '2'
          SEACHECK_METRO_PORT: '8092'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          # Default skin — pixel_6 has hung QEMU on free 2-vCPU runners.
          force-avd-creation: true
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # ANDROID_SERIAL is set by the action. Prefer it over brittle adb awk.
          script: export SEACHECK_MAESTRO_DEVICE="${ANDROID_SERIAL:-emulator-5554}" && npm run ci:maestro
